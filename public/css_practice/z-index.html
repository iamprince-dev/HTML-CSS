<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        header,nav,main,aside,footer{
            padding: 20px;
            font-size: 15px;
            border: 2px solid gray;
            margin: 2px;
            text-align: center;
        }
        main{
            height: 500px;
        }
        @media screen and (orientation: landscape) {
            body{
                display: grid;
            grid-template-columns: 2fr 8fr 2fr;
            }
            header{
                grid-row: 1;
                grid-column: 1/4;
            }
            aside{
                grid-row: 2;
                grid-column: 3;
            }
            nav{
                grid-row: 2;
                grid-column: 1;

            }
            main{
                grid-row: 2;
                grid-column: 2;
            }
          footer{
            grid-row: 3;
            grid-column: 1/4;
          }
            
        }
       @media screen and(orientation: portrait){

        body{
            display: grid;
            grid-column: 12fr;
        }
        header{
            grid-row: 1;
        }
        nav{
            grid-row: 2;
        }
        main{
            grid-row: 3;
        }
        aside{
            grid-row: 4;
        }
        footer{
            grid-row: 5;
        }
        
       }
    </style>
    <title>Document</title>
</head>
<body>
    <header>Amazon</header>
    <nav>Nav</nav>
    <main>Main</main>
    <aside>Aside</aside>
    <footer>Footer</footer>
</body>
</html>
