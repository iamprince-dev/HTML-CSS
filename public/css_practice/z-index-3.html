<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card-1{
            width: 300px;
            height: 500px;
            background-image: url(../images/latest1.avif);  
            background-size: cover;    
        }
               .card-2{
            width: 300px;
            height: 500px;
            background-image: url(../images/latest2.avif);  
            background-size: cover;    
        }
                .card-3{
            width: 300px;
            height: 500px;
            background-image: url(../images/latest3.avif);  
            background-size: cover;    
        }
        .brand{
            font-size: 35px;

        }
        header{
            padding: 20px 100px 20px 100px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
           background-color: aquamarine;
           align-items: center;
           margin-left: 20px;
           margin-right: 20px;
        }
        nav span{
            margin-right: 10px;
            font-size: 20px;
        }
        section{
            display: grid;
            grid-template-columns: 4fr 4fr 4fr;
            margin-top: 20px;
            margin-left: 100px;
            margin-right: 100px;
        }
        @media screen and (max-width: 650px){
            nav{
                display: none;

            }
            header{
                   display: flex;
                   flex-direction: row;
                   justify-content: space-between;
            }
            section{
                display: block;

            }
            section div{
                margin-top: 20px;
            }
            .bi-justify{
                display: inline;
            }
        }
        .bi-justify{
            padding: 15px;
            display: none;
        }
        footer{
            display: grid;
            grid-template-columns: repeat( 5,1fr);
            margin-top: 20px;
            background-color: rgb(14, 13, 13);
            color: gray;
            border-top: 1px solid gray;
            padding-top: 100px;
            font-size: 22px;
            
        }
        .col-1{
            display: flex;
            flex-direction: column;
        }
        .col-2{
            display: flex;
            flex-direction: column;
        }
        .col-3{
            display: flex;
            flex-direction: column;
        }
        .col-4{
            display: flex;
            flex-direction: column;
        }
        .highlight{
            font-size: 25px;
            color:white;
            padding-bottom: 20px;
        }
        .col-1 span{
            margin-bottom: 15px;
        }
        .col-2 span{
            margin-bottom: 15px;
        }
        .col-3 span{
            margin-bottom: 15px;
        }
        .col-4 span{
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
     <header>
        <button class="bi bi-justify"></button>
        <div class="brand">Flipkart</div>
        <nav>
            <span>Home</span>
            <span>Mens</span>
            <span>Women</span>
            <span>Kids</span>
            <span>Shop</span>
        </nav>
     </header>

    <section>
        <div class="card-1">
         
        </div>
        <div class="card-2"></div>

        <div class="card-3"></div>
    </section>
       

     <footer>
          <div class="brand">
            <span class="bi bi-shop"></span>
            <span class="brand-name"><span class="cap">Capital</span> Shop</span>
        </div>
        <div class="col-1">
            <span class="highlight">Shop men</span>
            <span>Clothing Fashion</span>
            <span>Winter</span>
            <span>Formal</span>
            <span>Casual</span>
        </div>
        <div class="col-2">
            <span class="highlight">Shop Women</span>
            <span>Clothing Fashion</span>
            <span>Winter</span>
            <span>Formal</span>
            <span>Casual</span>
        </div>
        <div class="col-3">
            <span class="highlight">Baby Collection</span>
            <span>Clothing Fashion</span>
            <span>Winter</span>
            <span>Formal</span>
            <span>Casual</span>
        </div>
        <div class="col-4">
            <span class="highlight">Quick Links</span>
            <span>Track Your Order</span>
            <span>Support</span>
            <span>FAQ</span>
            <span>About</span>
            <span>Contact Us</span>
        </div>

     </footer>
</body>
</html>
