<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        form img{
            height:100% ;
            width: 700px;
            
        }
        body{
        display: flex;
        justify-content: center;
        font-family: arial;
        }
            
        
        form{
            display: grid;
            grid-template-columns: 6fr 6fr;
            width: 80%;
            padding: 5px;
            background-color: rgb(9, 8, 8);

        }
        .form{
            padding-top: 10px;
            padding-left: 100px;
            padding-right: 100px;
            margin-bottom: 100px;

            
        }
        .signup-login{
            background-color: rgb(48, 45, 45);
            border-radius: 20px;
            padding: 4px;
            width: 180px;
            margin-left:145px ;
            margin-bottom: 30px;
            
        }
        .login{
            border: none;
            color: white;
            background-color: rgb(48, 45, 45);
            width: 60px;
            font-size: 16px;
            text-align: end;
        }
        .signup{
            background-color: rgb(248, 197, 32);
            color: grey;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            border-radius: 20px;
            border: none;
            width: 90px;
        }
        .form-title{
              font-size: 35px;
              margin-top: 20px;
              text-align: center;
              color: white;
              margin-bottom: 35px;
        }
        .form-field{
            margin-top: 20px;
            
            

        }
        .form-control{
            padding: 15px;
            width: 90%;
            font-size: 18px;
            border-radius: 15px;
            background-color: rgb(48, 45, 45);
            border: none;
        }
        .create-button{
            padding: 15px;
            width: 97%;
            font-size: 18px;
            border-radius: 15px;
            text-align: center;
            background-color: rgb(241, 220, 31);
            margin-top: 40px;
            margin-bottom: 20px;
        }
        .icons{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }
        .icons div{
            padding: 15px;
            width: 100px;
            margin: 10px;
            background-color:rgb(48, 45, 45) ;
            border-radius: 15px;
            color: white;
            text-align: center;
        }
        fieldset {
        border: none;
        border-top: 1px solid grey;
        text-align: center;
        padding-left: 10px;

        
       }

       legend {
       padding: 0 15px;
        color: grey;
       }
        .name{
            padding: 15px;
            width: 210px;
            background-color: rgb(48, 45, 45);
            color: rgb(76, 73, 73);
            border-radius: 15px;
            border: none;
            font-size: 17px;


        }
        .username{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding-right: 20px;
        }
        .bi-facebook{
            color: rgb(0, 85, 255);
        }
        .bi-google{
            color: transparent;
            background-clip: text;
            background-image: linear-gradient(to bottom, red, yellow, green, blue);
        }
    </style>
</head>
<body>

    <form>
         <div><img src="./../images/robot.webp" alt=""></div>

       <div class="form">
        <div class="signup-login">
             <span>
                <button class="signup">Signup</button>
             </span>
            <span >
                <button class="login">Login</button>
             </span>
        </div>

        <div class="form-title">
           Create An Account
        </div>
        <div class="username">
            <span class="fname">
                <input class="name" type="text" name="fname" placeholder="Name">
            </span>
            <span class="lname">
                <input type="text" class="name" name="lname" placeholder=" LastName">
            </span>

        </div>

        <div class="form-field">
            <input class="form-control" type="email" name="email" placeholder="Enter Your Email ">

        </div>

        <div class="form-field">
            <input type="password"  class="form-control" name="password" placeholder="Password">


        </div>
        <div class="form-field">
            <input type="password" class="form-control" name="confirm" placeholder="Confirm Pasword">

        </div>

        <div>
            <button class="create-button">Create An Account</button>

        </div>

        <fieldset>
            <legend>or</legend>
        </fieldset>

        <div class="icons">
            <div>
                <span class="bi bi-google"></span>
             </div>
            <div>
                <span class="bi bi-facebook"></span>
             </div>
            <div>
                <span class="bi bi-apple"></span>
             </div>
        </div>

        </div> 
    </form>
    
</body>
</html>
