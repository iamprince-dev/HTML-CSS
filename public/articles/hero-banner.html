<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        article{
             background-image: url("../images/cruiseship.jpg");
            background-size: 100% 100%;
            height: 1000px;
        }
        .shade{
           
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            margin: -10px;
            

            


        }
        .artical-title{
            font-size: 45px;
            color: white;
             text-shadow: 2px 2px 2px rgb(36, 34, 34);
        }
        .subtitle{
            font-size: 24px;
            color: white;
            text-align: center;
            margin: 20px;
            text-shadow: 2px 2px 2px rgb(36, 34, 34);
        }
        .btn{
            text-align: center;
            font-weight: bold;
            margin:40px;

        }
        .explore{
               border: 1px solid rgb(231, 3, 3);
            border-radius: 10px;
            background-color: red;
            padding: 12px;
            color: white;
            margin: 20px;
            
        }
        .download{
            border: 1px solid white;
            background-color: white;
            border-radius: 50px;
            color: grey;
            padding: 12px;
           
        }
    </style>
        
        
</head>
<body>
   <article>
      <div class="shade">

         <div >

              <div class="artical-title">
                  Welocme to cruise Travel
              </div>

             <div class="subtitle">
                 Discover our world class cruise
             </div>
              <div class="btn">
                 <span class="explore">Explor the beauty</span>
                 <span class="download">Download</span>

             </div>
        </div>
      </div>
   </article>
     
</body>
</html>
