<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">


<style>

    .resion{
        display: grid;
        grid-template-columns: 3fr 3fr 3fr 3fr;
        padding-left: 100px;
        padding-right: 100px;
        margin-top: 50px;
    }

    .resion-card{
        width: 300px;
        height: 400px;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid grey;
        box-shadow: 2px 2px 2px rgb(13, 12, 12);
        margin: 15px;
        position: relative;
        
    }

    .number{

        font-size: 120px;
        font-weight: bold;
        text-shadow: 2px 2px 2px  white;
        position: absolute;
        left: -30px;
        top: 100px;
        

        
    }
    
    .resion-subtitle{

        font-size: 20px;
        margin-bottom: 20;
        color: white;
        padding-left: 15px;
        margin-top: 30px;
    }
    .pic-1{
        background-image: url(./images/Dooms.avif);
        background-size: cover;
    }

     .pic-2{
        background-image: url(./images/prime-mov.avif);
        background-size: cover;
    }

     .pic-3{
        background-image: url(./images/vibe-move.webp);
        background-size: cover;
    }

     .pic-4{
        background-image: url(./images/Oddysey.avif);
        background-size: cover;
    }
    

</style>
</head>
<body>

    <section class="resion">

        

        <div class="resion-card pic-1">

            <div class="number">1  </div>

               
        </div>

          <div class="resion-card pic-2">

              <div class="number">2 </div>

                
           </div>


            <div class="resion-card pic-3">

              <div class="number">3</div>

                
           </div>


            <div class="resion-card pic-4">

              <div class="number">4 </div>

                
           </div>


        

    </section>
    
</body>
</html>
