<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
            
        dialog{
            background-color: rgb(248, 245, 245);
            height: 700px; 
            width: 500px;
            border: none;
            padding-left: 70px;
            margin-top: 50px;
            font-family: Arial;
            box-shadow: 5px 5px 3px grey;
        }
        
        .header{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            border-bottom: 1px solid grey;
            padding-right: 50px;
            padding-left: 50px;
            padding-bottom: 16px;
            font-size: 25px;   
            width: 300px;
            margin-bottom: 25px;
        }
        
        .login-title{
            font-size: 30px; 
            margin-bottom: 5px;
            margin-top: 11px;
            word-spacing: 2px;
            color: black;

        }
        .login-subtitle{
            color: rgb(101, 96, 96);
            margin-bottom: 25px;

        }
        .email{
            border: 1px solid grey;
            padding: 15px;
            width: 350px;
            margin-bottom: 15px;
            color: grey;
            border-radius: 5px;
            font-size: 20px;
        }
        .password{
            border: 1px solid grey;
            width: 350px;
            padding: 15px;
            color: grey;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 20px;
        }
        .reminder{
            display: flex;
            justify-content: space-between;
            margin-bottom: 22px;
            width: 380px;
            font-size: 20px;

        }
        .bi-check-square-fill{
           color: blue;
           
        }
        .forgot{
            color: blue;
        }
        .rem{
            color: rgb(34, 32, 32);
            padding-left: 5px;
        }
        .login-btn{
            width: 350px;
            background-color: rgb(16, 16, 237);
            color: white;
            text-align: center;
            justify-content: center;
            padding: 12px;
            font-size: 25px;
            margin-bottom: 18px;
            border-radius: 6px;
            font-family: arial;
        }
        .or{
            width: 350px;
            text-align: center;
            margin-bottom: 18px;
            font-size: 20px;
        }
        .continue{
            width: 350px;
            display: flex;
            padding: 15px;
            justify-content: center;
            border: 1px solid grey;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 20px;


        }
        .github{
            display: flex;
            justify-content: center;
            padding: 15px;
            width: 350px;
            
            border: 1px solid grey;
            border-radius: 5px;
            font-size: 20px;
            
        }
        .footer{
            text-align: center;
            margin-bottom: 15px;
            margin-top: 18px;
            width: 350px;
            font-size: 20px;
            color: rgb(113, 110, 110);
        }
        .foot-signup{
            color: blue;
        
        }
        .text-2{
            padding-left: 5px;
        }
        .bi-google{
            color: transparent;
            background-clip: text;
            background-image: linear-gradient(to bottom, red, yellow, green, blue);

        }
        .bi-x-lg{
           
            font-size: 24px;
            
            text-align: right;
            padding: 5px;
            
        }
    </style>
</head>
<body>
    <dialog open>
        <div class="bi bi-x-lg"></div>
    <div class="header">
        <span class="forgot"> Login</span>
        <span class="">Sign Up</span>

    </div>

    <div class="body">
        <div class="login-title">Login To Your Account</div>
        <div class="login-subtitle">Enter your credentials to access your account</div>

        <div class="email">
            <span class="bi bi-envelope"></span>
            <span class="text-2">Email address</span>

        </div>
        <div class="password">
            <span class="bi bi-lock"><span class="text-2">Password</span></span>
            <span class="bi bi-eye"></span>

        </div>
        <div class="reminder">
            <div class="bi bi-check-square-fill"><span class="rem">Remember me</span> </div>
            <div class="forgot">Forgot password?</div>

        </div>
        <div class="login-btn">
            <span>Login</span>

        </div>
        <div class="or">
            <span>OR</span>

        </div>
        <div class="continue">
            <span class="bi bi-google"></span>
            <span class="text-2">Continue with Google</span>

        </div>
        <div class="github">
            <span class="bi bi-github"></span>
            <span class="text-2">Continue with Github</span>

        </div>

    </div>
    <div class="footer">
        <span>Don't have anaccount?</span>
        <span class="foot-signup">Sign Up</span>
    </div>
    
    </dialog>
</body>
</html>
