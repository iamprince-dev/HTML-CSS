<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style type="text/css" media="screen">

        .ticket {

            border: 2px red double;

            padding: 20px;

            background-color: lightgreen;

        }

        dt {

            background-color: red;

            color:white;

            margin-bottom: 10px;

        }

        dd {

            background-color: yellow;

            margin-bottom: 10px;

        }

    </style>

    <style type="text/css" media="print">

        aside, button {

            display: none;

        }

        dl {

            display: grid;

            grid-template-columns: 3fr 9fr;

        }

        dt, dd {

            background-color: black;

            color:white;

            margin-bottom: 10px;

        }

    </style>

</head>

<body>

    <div class="ticket">

        <h1>Ticket</h1>

        <aside>

            <h4>Ads</h4>

            <img src="././images/data-science.png" width="100" height="100">

        </aside>

        <dl>

            <dt>Departure</dt>

            <dd>Hyderabad</dd>

            <dt>Arrival</dt>

            <dd>Delhi</dd>

        </dl>

        <button>Print</button>

    </div>

</body>

</html>
