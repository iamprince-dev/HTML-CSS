<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input:optional+span{
            display: none;
        }
        input:required+span{
            display: inline;
            color: red;
            font-size: 14px;
        }
        input:optional{
            border: 1px solid gray;
        }
        input:required{
            border: 1px solid red;
        }
        input{
            outline: none;
        }
        #uname:valid+span{
            display: none;
            
        }
        #uname:valid{
            border: 1px solid green;
        }
        #mobile:valid+div{
            display: none;
        }
        #mobile:invalid+div{
            display: block;
            color: red;
            font-size: 15px;
        }
        #age:in-range+div{
            display: none;
        }
        #age:out-of-range+div{
            display: block;
            color: red;
            font: 15px;
        }
        #button{
           background-color: rgb(95, 159, 244);
           padding: 15px;
           border-radius: 15px;
        }
        #button:hover{
            background-color: rgb(52, 153, 242);
            cursor: grab;

        }
    </style>
</head>
<body>
    
    <form>

        <dl>

        <dt>User Name</dt>

        <dd><input type="text" id="uname" required><span>*</span></dd>

        <dt>Password</dt>

        <dd><input type="password" id="password" ><span>*</span></dd>

        <dt>Mobile</dt>

        <dd>

            <input type="text" id="mobile" pattern="^\+91[6-9]\d{9}$" >

            <div>Invalid Mobile : +91 and 10 digits required start with 6789</div>

        </dd>

        <dt>Age</dt>

        <dd>

            <input type="number" id="age" min="15" max="30">

            <div>Age 15 to 30 only</div>

        </dd>

    </dl>

      <button id="button">Submit</button>

    </form>

</body>
</html>
