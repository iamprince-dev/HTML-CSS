<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</head>
<body class="d-flex justify-content-center align-items-center">
    
    <form class="form border border-2 w-50 m-4 p-3">
        <div class="text-center fs-3 fw-bold">
            Course Registration Form
        </div>
        <div class="row mt-5">
            <div class="col-6">
                <label for="name" class="form-label">First Name</label>
            <div>
                <input type="text" class="form-control" id="name">
            </div>
            </div>

            <div class="col-6">
                 <label for="last" class="form-label">Last Name</label>
            <div>
                <input type="text" class="form-control" id="last">
            </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-6">
                <label for="email" class="form-label">Email</label>
            <div>
                <input type="email" class="form-control" id="email">
            </div>
            </div>

            <div class="col-6">
                 <label for="phone" class="form-label">Your Phone</label>
            <div>
                <input type="tel" class="form-control" id="phone">
            </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-6">
                <label for="birth" class="form-label">Birth Date</label>
            <div>
                <input type="date" class="form-control" id="birth">
            </div>
            </div>

            <div class="col-6">
                 <label for="gender" class="form-label">Gender</label>
            <div>
                <select name="gender" id="gender"  class="form-select">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option> 
                <option value="other">Other</option>
                    
                </select>
            </div>
            </div>
        </div>
        <div class="mt-3">
            <label for="address" class="form-label">Address</label>
            <div> 
                <input type="text" class="form-control" id="address" placeholder="Address">
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-4">
                <label for="city" class="form-label">City</label>
            <div>
                <input type="text" class="form-control" id="city">
            </div>
            </div>

            <div class="col-4">
                 <label for="state" class="form-label">State/Region</label>
            <div>
                <input type="tel" class="form-control" id="state">
            </div>
            </div>

            <div class="col-4">
                 <label for="postal" class="form-label">Postal</label>
            <div class="position-relative">
                <li class="bi bi-mailbox position-absolute  top-50 start-0 translate-middle-y ms-3"></li>
                <input type="tel" class="form-control" id="postal">
            </div>
            </div>
        </div>

        <div class="mt-3 mb-5">
    <label for="country" class="form-label">Country</label>

    <div class="position-relative">
        <i class="bi bi-globe position-absolute top-50 start-0 translate-middle-y ms-3"></i>

        <input type="text" class="form-control ps-5"
               id="country" placeholder="Enter Country">
    </div>
</div>
    </form>
</body>
</html>
