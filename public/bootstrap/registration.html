<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</head>
<body class="d-flex justify-content-center align-items-center">
    
    <form class="form border border-2 w-50 m-4 p-3">
        <div class="text-center fs-3 fw-bold">
            Course Registration Form
        </div>
        <div class="row mt-5">
            <div class="col-6">
                <label for="name" class="form-label">First Name</label>
            <div>
                <input type="text" class="form-control" id="name">
            </div>
            </div>

            <div class="col-6">
                 <label for="name" class="form-label">Last Name</label>
            <div>
                <input type="text" class="form-control" id="name">
            </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-6">
                <label for="email" class="form-label">Email</label>
            <div>
                <input type="email" class="form-control" id="email">
            </div>
            </div>

            <div class="col-6">
                 <label for="phone" class="form-label">Your Phone</label>
            <div>
                <input type="text" class="form-control" id="phone">
            </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-6">
                <label for="birth" class="form-label">Birth Date</label>
            <div>
                <input type="datetime-local" class="form-control" id="birth">
            </div>
            </div>

            <div class="col-6">
                 <label for="gender" class="form-label">Gender</label>
            <div>
                <select name="gender" id="gender" class="w-100 p-2">
                    <option>Male</option>
                    <option>Female</option>
                    <option>Common</option>
                </select>
            </div>
            </div>
        </div>
    </form>
</body>
</html>
