<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</head>
<body>
    <div class="carousel slide  " data-bs-theme="dark" data-bs-ride="carousel" id="slide ">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="../images/banner-1.jpg" height="500px" alt="" class="w-100 ">
            </div>
            <div class="carousel-item">
                <img src="../images/banner-4.jpg" height="500px" alt="" class="w-100">
            </div>
            <div class="carousel-item">
                <img src="../images/ban-2.jpg" height="500px" alt="" class="w-100">
            </div>
            <div class="carousel-item">
                <img src="../images/ban-3.jpg" height="500px" alt="" class="w-100">
            </div>
        </div>
        <button class="carousel-control-prev" data-bs-target="#slide" data-bs-slide="prev" >
               <span class="carousel-control-prev-icon"></span>
        </button>
        <button data-bs-slide="next" data-bs-target="#slide" class="carousel-control-next">
            <span class="carousel-control-next-icon"></span>
        </button>
        <div class="carousel-indicators">
            <button data-bs-target="#slide" class="active" data-bs-slide-to="0"></button>
            <button data-bs-target="#slide" data-bs-slide-to="1"></button>
            <button data-bs-target="#slide" data-bs-slide-to="2"></button>
            <button data-bs-target="#slide" data-bs-slide-to="3"></button>
        </div>
    </div>
</body>
</html>
