<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</head>
<body class="d-flex justify-content-center align-items-center">
    
    <form class="border border-3 w-25 mt-5 p-4">
         <div class="fw-bold fs-3 text-center">
            User Login
         </div>
         <div class="mt-3">
            <label class="form-label" for="name">Name</label>
            <div>
                <input type="text" class="form-control" id="name" placeholder="Enter your name ">
            </div>
            <div class="mt-3">
            <label class="form-label" for="password">Passowrd</label>
            <div> 
                <input type="password" class="form-control" id="password" placeholder="Enter your password">
            </div>
            <div class="form-check mt-3">
                 <input type="checkbox" class="form-check-input" id="checkinput">
                 <label for="checkinput" class="form-check-label">Check me out </label>
            </div>
              
            <div class="d-flex w-50 justify-content-between mt-3">
                <div>
                    <input type="radio" class="" name="radio"><label for="male"><span class="ps-2">Male</span> </label>
                </div>
                <div>
                    <input type="radio" name="radio" id="female"><label for="femal"><span class="ps-2">Female</span></label>
                </div>
            </div>
            <div class="mt-3">
            <label class="form-label" for="number">Number</label>
            <div>
                <input type="text" class="form-control" id="number" placeholder="Mobile no.">
            </div>
            <div class="mt-3">
            <label class="form-label" for="city">City</label>
             <select name="city" id="city" class="w-50 p-2">
                <option>Hyderabad</option>
                <option>Pune</option>
                <option>Noida</option>
                <option>Banglore</option>
                <option>Mumbai</option>
             </select>  
            </div>
            <div>
                <button class="btn btn-primary p-1 mt-3 w-25 fs-4">Submit</button>
            </div>
    </form>
</body>
</html>
