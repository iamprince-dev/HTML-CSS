<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <title>Document</title>
</head>
<body class="d-flex justify-content-center ">
    
    <form class=" mt-3 w-25 border border-2 border-dark rounded-2 p-4 bg-dark text-white fs-6">
    <div class="fs-2 text-center mt-2 fw-bold">Forgot password</div>
    <div class="mt-3">
        <label for="email" class="form-label">Email</label>
        <div>
            <input type="email" class="form-control " id="email" placeholder="Enter your email">
        </div>
    </div>

    <div class="mt-4">
    <label for="verify" class="form-label">Verification code</label>

    <div class="d-flex gap-2 align-items-center">
        <input type="number" class="form-control"
            id="verify" placeholder="Enter verification code">

        <button type="button" class="btn btn-outline-primary text-nowrap">
            Send code
        </button>
    </div>
</div>

    <div class="mt-4">
        <label for="password" class="form-label" >New Password</label>
        <div>
            <input type="password" class="form-control" id="passward" placeholder="password must contain letters and number 8-32">
        </div>
    </div>

    <div class="mt-4">
        <label for="confirm" class="form-label">Confirm password</label>
        <div>
            <input type="password" class="form-control" id="confirm" placeholder="Re-enter password">
        </div>
    </div>
    <div class="mt-4 ">
        <button class="btn w-100 p-2 bg-primary text-white rounded">Reset password</button>
    </div>
    <div class="mt-3 mb-2">
        <button class="btn btn-link w-100 text-center text-decoration-none fs-5 "><span class="bi bi-lock"></span> Back to sign in</button>
    </div>
</form>
</body>

</html>
