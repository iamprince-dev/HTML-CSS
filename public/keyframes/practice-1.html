<!DOCTYPE html>
<html>
<head>
    <title>Moving Car Animation</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        .road {
            width: 100%;
            height: 150px;
            background-color: gray;
            position: absolute;
            bottom: 0;
        }

        .car {
            width: 200px;
            height: 80px;
            background-color: red;
            border-radius: 20px 40px 10px 10px;
            position: absolute;
            bottom: 150px;
            left: 0;

            animation: moveCar 5s linear infinite;
        }

        .roof {
            width: 100px;
            height: 50px;
            background-color: blue;
            position: absolute;
            left: 40px;
            top: -45px;
            border-radius: 40px 40px 0 0;
        }

        .wheel {
            width: 40px;
            height: 40px;
            background-color: black;
            border: 5px solid white;
            border-radius: 50%;
            position: absolute;
            bottom: -20px;

            animation: rotateWheel 1s linear infinite;
        }

        .wheel1 {
            left: 25px;
        }

        .wheel2 {
            right: 25px;
        }

        @keyframes moveCar {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(100vw);
            }
        }

        @keyframes rotateWheel {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

    </style>
</head>

<body>

    <div class="road"></div>

    <div class="car">

        <div class="roof"></div>

        <div class="wheel wheel1"></div>

        <div class="wheel wheel2"></div>

    </div>

</body>
</html>
