<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        div{
             display: flex;
             flex-direction: row;
             font-size: 80px;
             letter-spacing: 40px;

        }
        @keyframes Blink{
           1%{
            color: red;
            opacity: 0;
           }
           100%{
            opacity: 1;
            color: green;
           }
        }
        .bi-heart-pulse-fill{
            animation-name: Blink;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-delay: 1s;
            
        }
    </style>
</head>
<body>
    <div>
        <span>C</span>
        <span>A</span>
        <span>R</span>
        <span>D</span>
        <span>I</span>
        <span class="bi bi-heart-pulse-fill"></span>
        <span>C</span>
        <span>A</span>
        <span>R</span>
        <span>E</span>
    </div>
</body>
</html>
